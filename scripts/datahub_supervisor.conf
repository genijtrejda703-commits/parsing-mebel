[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres -D /app/data/postgres
user=postgres
autostart=true
autorestart=true
priority=50
redirect_stderr=true
stdout_logfile=/var/log/supervisor/postgres.out.log
stopsignal=INT

[program:redis]
command=/usr/bin/redis-server --dir /app/data/redis --appendonly no --save "" --bind 127.0.0.1 --port 6379
autostart=true
autorestart=true
priority=50
redirect_stderr=true
stdout_logfile=/var/log/supervisor/redis.out.log

[program:fastapi]
command=/root/.venv/bin/uvicorn server:app --host 0.0.0.0 --port 8001
directory=/app/backend
autostart=true
autorestart=true
priority=100
redirect_stderr=true
stdout_logfile=/var/log/supervisor/fastapi.out.log
environment=PYTHONUNBUFFERED="1"

[program:celery]
command=/root/.venv/bin/celery -A worker.celery_app worker --loglevel=INFO --concurrency=2
directory=/app/backend
autostart=true
autorestart=true
priority=110
redirect_stderr=true
stdout_logfile=/var/log/supervisor/celery.out.log
environment=PYTHONUNBUFFERED="1"
stopwaitsecs=20
